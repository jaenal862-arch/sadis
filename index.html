<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sistem Laporan Patroli Keamanan</title>
  
  <!-- Font Google & FontAwesome Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --primary: #3498db;
      --primary-dark: #2980b9;
      --secondary: #2c3e50;
      --success: #2ecc71;
      --warning: #f1c40f;
      --danger: #e74c3c;
      --light: #f8f9fa;
      --border: #e0e6ed;
    }
    
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      margin: 0;
      padding: 15px;
      min-height: 100vh;
      color: var(--secondary);
    }
    
    .container { max-width: 500px; margin: 0 auto; }
    
    .card {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      backdrop-filter: blur(10px);
      margin-bottom: 20px;
    }
    
    h2 { text-align: center; margin-top: 0; font-weight: 600; color: var(--secondary); font-size: 20px; }
    .header-icon { text-align: center; font-size: 40px; color: var(--primary); margin-bottom: 10px; }
    
    .form-group { margin-bottom: 15px; }
    label { font-weight: 500; font-size: 13px; display: block; margin-bottom: 5px; color: #555; }
    
    input[type="text"], input[type="password"], select, textarea {
      width: 100%; padding: 12px; border: 1.5px solid var(--border); border-radius: 10px;
      box-sizing: border-box; font-family: 'Poppins', sans-serif; font-size: 14px; background-color: var(--light);
    }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); background-color: white; }
    
    .btn {
      width: 100%; padding: 12px; background-color: var(--primary); color: white; border: none;
      border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; display: flex;
      justify-content: center; align-items: center; gap: 8px; transition: all 0.3s;
    }
    .btn:hover { background-color: var(--primary-dark); }
    .btn:disabled { background-color: #a0c4df; cursor: not-allowed; }
    .btn-danger { background-color: var(--danger); margin-top: 10px; }
    .btn-outline { background-color: transparent; border: 2px solid var(--primary); color: var(--primary); }
    
    .upload-area {
      border: 2px dashed var(--primary); border-radius: 12px; padding: 20px; text-align: center;
      background-color: #f0f7fb; cursor: pointer; margin-bottom: 10px;
    }
    .upload-icon { font-size: 30px; color: var(--primary); margin-bottom: 5px; }
    .upload-text { font-size: 13px; color: var(--primary-dark); font-weight: 500; }
    input[type="file"] { display: none; }
    
    #img-preview { width: 100%; max-height: 200px; object-fit: cover; border-radius: 10px; display: none; border: 2px solid #ddd; }
    #retake-container { display: none; margin-top: 10px; }
    
    .loader {
      border: 3px solid rgba(255,255,255,0.3); border-top: 3px solid white; border-radius: 50%;
      width: 16px; height: 16px; animation: spin 1s linear infinite; display: inline-block;
    }
    .loader-dark { border: 3px solid rgba(0,0,0,0.1); border-top: 3px solid var(--primary); }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    /* TAB NAVIGASI */
    .tab-container { display: flex; background: #e0e6ed; border-radius: 12px; margin-bottom: 20px; overflow: hidden; }
    .tab-btn { flex: 1; padding: 12px; text-align: center; font-weight: 600; font-size: 13px; color: #555; cursor: pointer; transition: 0.3s; }
    .tab-btn.active { background: var(--primary); color: white; }
    
    /* RIWAYAT LAPORAN CARDS */
    .riwayat-card {
      background: white; border-radius: 12px; padding: 15px; margin-bottom: 15px;
      border-left: 5px solid var(--primary); box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }
    .riwayat-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; border-bottom: 1px solid #eee; padding-bottom: 8px; }
    .riwayat-waktu { font-size: 11px; color: #7f8c8d; font-weight: 600; }
    .riwayat-badge { padding: 4px 8px; border-radius: 20px; font-size: 10px; font-weight: 600; color: white; }
    .bg-aman { background-color: var(--success); }
    .bg-rawan { background-color: var(--danger); }
    .bg-teguran { background-color: var(--warning); color: #333; }
    
    .riwayat-body { display: flex; gap: 15px; align-items: flex-start; }
    .riwayat-info { flex: 1; }
    .riwayat-lokasi { font-weight: 600; font-size: 14px; color: var(--secondary); margin: 0 0 4px 0; }
    .riwayat-ket { font-size: 12px; color: #555; margin: 0 0 8px 0; line-height: 1.4; }
    .riwayat-petugas { font-size: 11px; color: var(--primary); font-weight: 500; }
    .riwayat-img { width: 70px; height: 70px; border-radius: 8px; object-fit: cover; border: 1px solid #ddd; }
    
    .empty-state { text-align: center; padding: 30px 0; color: #95a5a6; font-size: 14px; }
    .action-icons button { background: none; border: none; cursor: pointer; font-size: 18px; margin-left: 10px; transition: 0.2s; }
    .action-icons button:hover { transform: scale(1.1); }
    
    /* CSS TAMPILAN CETAK / PRINT */
    @media print {
      body { background: white; padding: 0; color: black; }
      .container { max-width: 100%; margin: 0; }
      .tab-container, #login-section, #form-section, .action-icons, .btn-danger { display: none !important; }
      #main-app, #riwayat-section { display: block !important; }
      .card { box-shadow: none; padding: 0; margin: 0; background: white; }
      .riwayat-card { border: 1px solid #ccc; page-break-inside: avoid; border-left: 5px solid var(--primary); margin-bottom: 10px; }
      .riwayat-badge { border: 1px solid #000; }
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- HALAMAN LOGIN -->
    <div id="login-section" class="card">
      <div class="header-icon"><i class="fas fa-shield-alt"></i></div>
      <h2>Portal Keamanan</h2>
      <div class="form-group">
        <label><i class="fas fa-user"></i> Username</label>
        <input type="text" id="username" placeholder="Masukkan username">
      </div>
      <div class="form-group">
        <label><i class="fas fa-lock"></i> Password</label>
        <input type="password" id="password" placeholder="Masukkan password">
      </div>
      <button class="btn" id="btn-login" onclick="prosesLogin()">
        <i class="fas fa-sign-in-alt"></i> Masuk
      </button>
    </div>

    <!-- UTAMA (Form & Riwayat) -->
    <div id="main-app" style="display: none;">
      
      <!-- NAVIGASI TAB -->
      <div class="tab-container">
        <div class="tab-btn active" id="tab-form-btn" onclick="switchTab('form')"><i class="fas fa-edit"></i> Buat Laporan</div>
        <div class="tab-btn" id="tab-riwayat-btn" onclick="switchTab('riwayat')"><i class="fas fa-history"></i> Riwayat</div>
      </div>

      <!-- FORM LAPORAN -->
      <div id="form-section" class="card">
        <div style="text-align: center; margin-bottom:15px;">
          <span style="background:var(--primary); color:white; padding:4px 12px; border-radius:20px; font-size:12px;">
            <i class="fas fa-user-circle"></i> <span id="nama-petugas-tampil"></span>
          </span>
        </div>
        
        <input type="hidden" id="nama-petugas">
        <input type="hidden" id="foto-base64">

        <div class="form-group">
          <label>Lokasi Patroli</label>
          <input type="text" id="lokasi" placeholder="Misal: Gerbang Utama">
        </div>

        <div class="form-group">
          <label>Status Keamanan</label>
          <select id="status">
            <option value="">-- Pilih Kondisi --</option>
            <option value="Aman Terkendali">✅ Aman Terkendali</option>
            <option value="Peringatan/Teguran">⚠️ Peringatan / Teguran</option>
            <option value="Rawan/Bahaya">🚨 Rawan / Bahaya</option>
          </select>
        </div>

        <div class="form-group">
          <label>Keterangan Tambahan</label>
          <textarea id="keterangan" rows="2" placeholder="Jelaskan detail situasi..."></textarea>
        </div>

        <div class="form-group">
          <label>Bukti Foto (Wajib)</label>
          <div id="camera-placeholder" class="upload-area" onclick="document.getElementById('file-upload').click();">
            <div class="upload-icon"><i class="fas fa-camera"></i></div>
            <div class="upload-text">Ketuk untuk Ambil Foto / Galeri</div>
          </div>
          <input type="file" id="file-upload" accept="image/*" capture="environment" onchange="handleFileUpload(event)">
          <img id="img-preview" alt="Preview Foto">
          <div id="retake-container">
            <button class="btn btn-outline" onclick="document.getElementById('file-upload').click();">
              <i class="fas fa-sync-alt"></i> Ganti Foto
            </button>
          </div>
        </div>

        <button class="btn" id="btn-submit" onclick="kirimLaporan()" style="margin-top: 15px;">
          <i class="fas fa-paper-plane"></i> Kirim Laporan
        </button>
        <button class="btn btn-danger" onclick="logout()">
          <i class="fas fa-power-off"></i> Keluar
        </button>
      </div>

      <!-- RIWAYAT LAPORAN -->
      <div id="riwayat-section" style="display: none;">
        <div class="card" style="padding: 15px;">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; border-bottom: 2px solid var(--light); padding-bottom: 10px;">
            <h2 style="margin:0; font-size:16px;">Laporan Terakhir</h2>
            <div class="action-icons">
              <button onclick="window.print()" style="color:var(--secondary);" title="Cetak / Simpan PDF">
                <i class="fas fa-print"></i>
              </button>
              <button onclick="loadRiwayat()" style="color:var(--primary);" title="Segarkan Data">
                <i class="fas fa-sync-alt"></i>
              </button>
            </div>
          </div>
          <div id="riwayat-konten">
            <div class="empty-state"><div class="loader loader-dark"></div> Memuat data...</div>
          </div>
        </div>
      </div>

    </div>

  </div>

  <script>
    // =========================================================================
    // PASTE URL WEB APP GOOGLE APPS SCRIPT ANDA DI BAWAH INI (Harus berakhiran /exec)
    // =========================================================================
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwtiR2AXGb7knvc8gzqhBKJOsZXvz8cbzUduSXzy_8/dev";

    // --- NAVIGASI TAB ---
    function switchTab(tabName) {
      if(tabName === 'form') {
        document.getElementById('form-section').style.display = 'block';
        document.getElementById('riwayat-section').style.display = 'none';
        document.getElementById('tab-form-btn').classList.add('active');
        document.getElementById('tab-riwayat-btn').classList.remove('active');
      } else {
        document.getElementById('form-section').style.display = 'none';
        document.getElementById('riwayat-section').style.display = 'block';
        document.getElementById('tab-riwayat-btn').classList.add('active');
        document.getElementById('tab-form-btn').classList.remove('active');
        loadRiwayat();
      }
    }

    // --- SISTEM LOGIN PETUGAS ---
    function prosesLogin() {
      const user = document.getElementById('username').value;
      const pass = document.getElementById('password').value;
      const btn = document.getElementById('btn-login');
      
      if(!user || !pass) return alert("Username dan Password tidak boleh kosong!");
      
      btn.innerHTML = 'Memverifikasi... <div class="loader"></div>'; 
      btn.disabled = true;
      
      fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'login', user: user, pass: pass })
      })
      .then(res => res.json())
      .then(res => {
        btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Masuk'; 
        btn.disabled = false;
        
        if(res.success) {
          document.getElementById('login-section').style.display = 'none';
          document.getElementById('main-app').style.display = 'block';
          document.getElementById('nama-petugas').value = res.namaLengkap;
          document.getElementById('nama-petugas-tampil').innerText = res.namaLengkap;
          loadRiwayat();
        } else { 
          alert(res.message || "Username/Password Salah!"); 
        }
      })
      .catch(err => {
        alert("Error Koneksi: " + err); 
        btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Masuk'; 
        btn.disabled = false;
      });
    }

    function logout() { 
      if(confirm("Apakah Anda yakin ingin keluar?")) window.location.reload(); 
    }

    // --- KOMPRESI FOTO ---
    function handleFileUpload(event) {
      const file = event.target.files[0]; 
      if (!file) return;
      
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const MAX_WIDTH = 1000; 
          let width = img.width; 
          let height = img.height;
          
          if (width > MAX_WIDTH) { 
            height = Math.round((height * MAX_WIDTH) / width); 
            width = MAX_WIDTH; 
          }
          
          const tempCanvas = document.createElement('canvas'); 
          tempCanvas.width = width; 
          tempCanvas.height = height;
          tempCanvas.getContext('2d').drawImage(img, 0, 0, width, height);
          
          const compressedBase64 = tempCanvas.toDataURL('image/jpeg', 0.6); 
          document.getElementById('foto-base64').value = compressedBase64;
          
          document.getElementById('camera-placeholder').style.display = 'none';
          const imgPreview = document.getElementById('img-preview');
          imgPreview.src = compressedBase64; 
          imgPreview.style.display = 'block';
          document.getElementById('retake-container').style.display = 'block';
        }
        img.src = e.target.result;
      }; 
      reader.readAsDataURL(file);
    }

    // --- KIRIM LAPORAN ---
    function kirimLaporan() {
      const btn = document.getElementById('btn-submit');
      const petugas = document.getElementById('nama-petugas').value;
      const lokasi = document.getElementById('lokasi').value;
      const status = document.getElementById('status').value;
      const keterangan = document.getElementById('keterangan').value;
      const base64Image = document.getElementById('foto-base64').value;

      if(!lokasi || !status || !base64Image) return alert("Lokasi, Status, dan Foto WAJIB diisi!");
      
      btn.innerHTML = 'Mengirim... <div class="loader"></div>'; 
      btn.disabled = true;

      fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          action: 'saveLaporan',
          petugas: petugas, 
          lokasi: lokasi, 
          status: status, 
          keterangan: keterangan, 
          fotoBase64: base64Image
        })
      })
      .then(res => res.json())
      .then(res => {
        let isSuccess = (typeof res === 'string' && res.includes("SUKSES")) || 
                         (typeof res === 'object' && JSON.stringify(res).includes("SUKSES"));
                         
        if (isSuccess) {
          alert("✅ Laporan berhasil dikirim!");
          document.getElementById('lokasi').value = '';
          document.getElementById('status').value = '';
          document.getElementById('keterangan').value = '';
          document.getElementById('foto-base64').value = '';
          document.getElementById('img-preview').style.display = 'none';
          document.getElementById('retake-container').style.display = 'none';
          document.getElementById('camera-placeholder').style.display = 'block';
          btn.innerHTML = '<i class="fas fa-paper-plane"></i> Kirim Laporan'; 
          btn.disabled = false;
          switchTab('riwayat');
        } else {
          alert("❌ Gagal menyimpan data: " + JSON.stringify(res)); 
          btn.innerHTML = '<i class="fas fa-paper-plane"></i> Kirim Laporan'; 
          btn.disabled = false;
        }
      })
      .catch(err => {
        alert("Gagal koneksi: " + err); 
        btn.innerHTML = '<i class="fas fa-paper-plane"></i> Kirim Laporan'; 
        btn.disabled = false;
      });
    }

    // --- MEMUAT RIWAYAT LAPORAN ---
    function loadRiwayat() {
      document.getElementById('riwayat-konten').innerHTML = '<div class="empty-state"><div class="loader loader-dark"></div> Memuat data...</div>';
      
      fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'getLaporan' })
      })
      .then(res => res.json())
      .then(data => {
        let html = '';
        if(!Array.isArray(data) || data.length === 0) {
          html = '<div class="empty-state"><i class="fas fa-folder-open" style="font-size:30px; margin-bottom:10px;"></i><br>Belum ada laporan.</div>';
        } else {
          const limitData = data.slice(0, 15);
          limitData.forEach(row => {
            let badgeClass = 'bg-aman';
            if (row[3] && (row[3].includes('Rawan') || row[3].includes('Bahaya'))) badgeClass = 'bg-rawan';
            else if (row[3] && row[3].includes('Teguran')) badgeClass = 'bg-teguran';

            let imgUrl = row[6] && row[6] !== "" ? row[6] : "https://via.placeholder.com/150?text=No+Image";
            let linkAsli = row[5] && row[5] !== "-" ? row[5] : "#";

            html += `
              <div class="riwayat-card">
                <div class="riwayat-header">
                  <div class="riwayat-waktu"><i class="far fa-clock"></i> ${row[0]}</div>
                  <div class="riwayat-badge ${badgeClass}">${row[3]}</div>
                </div>
                <div class="riwayat-body">
                  <div class="riwayat-info">
                    <p class="riwayat-lokasi">${row[2]}</p>
                    <p class="riwayat-ket">${row[4] || '-'}</p>
                    <div class="riwayat-petugas"><i class="fas fa-user-shield"></i> ${row[1]}</div>
                  </div>
                  ${linkAsli !== "#" ? `<a href="${linkAsli}" target="_blank"><img src="${imgUrl}" class="riwayat-img" onerror="this.src='https://via.placeholder.com/150?text=Error'"></a>` : ''}
                </div>
              </div>
            `;
          });
        }
        document.getElementById('riwayat-konten').innerHTML = html;
      })
      .catch(err => {
        document.getElementById('riwayat-konten').innerHTML = '<div class="empty-state" style="color:red;">Gagal memuat data riwayat.</div>';
      });
    }
  </script>
</body>
</html>
